# ─────────────────────────────────────────────────────────────────────────
# All environment-specific values come from environment variables
# (see infra/.env.example). Secrets have NO defaults: the app refuses to
# start without APP_JWT_SECRET.
# Per-shop booking rules (deadlines, deposit, loyalty, slot grid, lead time)
# live on the tenant row and are edited via PUT /api/admin/settings.
# ─────────────────────────────────────────────────────────────────────────
spring:
  application:
    name: barbershop-backend
  lifecycle:
    timeout-per-shutdown-phase: ${APP_SHUTDOWN_TIMEOUT:20s}
  threads:
    virtual:
      enabled: true
  # Two logins (docs/DEPLOYMENT.md → Database roles): the connection pool uses the
  # least-privilege application role, Flyway its own migration (owner) role.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/barbershop}
    username: ${DB_USERNAME:barbershop_app}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # schema is owned by Flyway
    properties:
      # booking items / staff of a page of bookings are loaded in batches (no N+1)
      hibernate.default_batch_fetch_size: 50
    # NOTE: deliberately no hibernate.jdbc.time_zone. Instants (timestamptz) are
    # always stored as UTC by Hibernate 6; that property would also shift
    # LocalTime working hours by the JVM zone offset (09:00 → 10:00 in Berlin).
  flyway:
    locations: classpath:db/migration
    # migration role; without DB_MIGRATION_USERNAME Flyway uses the application login
    # (then the prod start-up check refuses a login that can run DDL)
    user: ${DB_MIGRATION_USERNAME:${DB_USERNAME:barbershop_app}}
    password: ${DB_MIGRATION_PASSWORD:${DB_PASSWORD:}}
    placeholders:
      app_role: ${DB_USERNAME:barbershop_app} # afterMigrate.sql grants this role its DML rights
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false   # unknown locale → messages.properties (German)
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null
  mvc:
    problemdetails:
      enabled: true
  thymeleaf:
    check-template-location: false

server:
  port: 8080
  # finish running requests on SIGTERM (container stop / rolling update) before shutting down
  shutdown: graceful
  # trust X-Forwarded-* only from internal proxies (Tomcat RemoteIpValve defaults),
  # so the rate limiter sees the real client IP behind the reverse proxy
  forward-headers-strategy: native
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health            # only /actuator/health, /health/liveness, /health/readiness
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      show-components: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  default-produces-media-type: application/json

# ── Payments ────────────────────────────────────────────────────────────
# Only "demo" exists (no real money, no card fields). The app refuses to start
# with the `prod` profile and the demo provider unless allow-in-prod=true.
payment:
  provider: ${PAYMENT_PROVIDER:demo}
  demo:
    allow-in-prod: ${PAYMENT_DEMO_ALLOW_IN_PROD:false}

app:
  # where the website runs (links in emails point here)
  frontend-base-url: ${APP_FRONTEND_BASE_URL:http://localhost:3000}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
  jwt:
    secret: ${APP_JWT_SECRET}         # required, ≥ 32 bytes
    access-ttl: ${APP_JWT_ACCESS_TTL:PT15M}
    issuer: barbershop-backend
  auth:
    refresh-ttl: ${APP_REFRESH_TTL:P30D}
    refresh-cookie-name: bs_refresh
    refresh-cookie-path: /api/auth   # the cookie is only sent to refresh/logout
    cookie-secure: ${APP_COOKIE_SECURE:false}   # true behind HTTPS (prod profile sets it)
    cookie-same-site: Strict
    max-failed-logins: 5
    lockout: PT15M
    email-verify-ttl: PT24H
    password-reset-ttl: PT1H
    barber-invite-ttl: PT72H
    min-password-length: 10
    consent-version: privacy-2026-10
  tokens:
    secret: ${APP_TOKEN_SECRET:}       # empty → derived from APP_JWT_SECRET
  links:
    book: /{lang}/booking
    manage: /{lang}/booking/manage/{token}
    pay: /{lang}/pay/{token}
    barber-decision: /{lang}/barber/requests/{token}
    verify-email: /{lang}/account/verify/{token}
    reset-password: /{lang}/account/reset-password/{token}
    account: /{lang}/account
    staff: /{lang}/admin
  admin:
    # bootstrap admin, created on startup if missing (never hardcoded in the repo)
    email: ${APP_ADMIN_EMAIL:}
    password: ${APP_ADMIN_PASSWORD:}
    tenant: ${APP_ADMIN_TENANT:the-barber-news}
    # production without the demo seed: create this shop on first start (slug = tenant above)
    tenant-name: ${APP_TENANT_NAME:}
    tenant-timezone: ${APP_TENANT_TIMEZONE:Europe/Berlin}
  mail:
    from: ${APP_MAIL_FROM:The Barber News <no-reply@example.com>}
    outbox:                          # transactional outbox (table mail_outbox), see MailOutbox
      max-attempts: ${APP_MAIL_MAX_ATTEMPTS:8}   # then DEAD (admin can retry): ~2 h of retries
      base-backoff: PT30S
      max-backoff: PT1H
      poll-interval: ${APP_MAIL_POLL_INTERVAL:PT15S}
      batch-size: 20
  booking:
    max-services: 5
    # open (PENDING_BARBER / AWAITING_PAYMENT) requests per email address — anti-spam
    max-open-requests-per-email: ${APP_BOOKING_MAX_OPEN_REQUESTS:3}
  db:
    # true: migrate on start (local); false: validate only, a migration job runs first (prod)
    migrate: ${APP_DB_MIGRATE:true}
  jobs:
    enabled: ${APP_JOBS_ENABLED:true}
    interval: ${APP_JOBS_INTERVAL:PT1M}
    batch-size: 200
  retention:                        # GDPR storage limitation (RetentionJob) — keep in sync with the privacy policy
    cancelled-bookings-months: ${APP_RETENTION_CANCELLED_MONTHS:6}     # anonymise declined/expired/cancelled
    completed-bookings-months: ${APP_RETENTION_COMPLETED_MONTHS:0}     # 0 = keep (tax/bookkeeping decide)
    unverified-accounts-days: ${APP_RETENTION_UNVERIFIED_DAYS:30}      # delete never-verified accounts
    outbox-days: ${APP_RETENTION_OUTBOX_DAYS:30}                       # delete the email delivery log
    cron: ${APP_RETENTION_CRON:0 30 3 * * *}
  captcha:                          # bot check on booking / register / forgot-password (header X-Captcha-Token)
    provider: ${APP_CAPTCHA_PROVIDER:none}          # none | turnstile (the prod profile refuses none, see below)
    secret: ${APP_CAPTCHA_SECRET:}
    verify-url: ${APP_CAPTCHA_VERIFY_URL:}         # empty = Cloudflare siteverify
    allow-none-in-prod: ${APP_CAPTCHA_ALLOW_NONE_IN_PROD:false}
  rate-limit:
    enabled: ${APP_RATE_LIMIT_ENABLED:true}
    # memory = per backend instance (fine for ONE instance); redis = shared, REQUIRED with several replicas
    store: ${APP_RATE_LIMIT_STORE:memory}
    redis-url: ${APP_RATE_LIMIT_REDIS_URL:}   # e.g. rediss://:password@host:6380/0
    bookings:                       # POST /api/public/{tenant}/bookings per client IP
      capacity: ${APP_RATE_LIMIT_BOOKINGS:10}
      period: PT1M
    login:                          # POST /api/auth/{tenant}/login per client IP
      capacity: ${APP_RATE_LIMIT_LOGIN:5}
      period: PT1M
    auth-mail:                      # register / forgot-password / resend-verification
      capacity: ${APP_RATE_LIMIT_AUTH_MAIL:5}
      period: PT10M
    token-actions:                  # POSTs on email-link tokens (accept/decline/pay/cancel)
      capacity: ${APP_RATE_LIMIT_TOKEN_ACTIONS:20}
      period: PT1M
    refresh:
      capacity: ${APP_RATE_LIMIT_REFRESH:30}
      period: PT1M
