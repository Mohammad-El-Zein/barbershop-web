<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${lang}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${shopName}">Barbershop</title>
</head>
<!-- Email-safe markup: tables + inline styles. Dark/gold to match the website. -->
<body style="margin:0;padding:0;background:#0a0a0a;font-family:Helvetica,Arial,sans-serif;color:#f2efe9;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#0a0a0a;">
  <tr>
    <td align="center" style="padding:32px 16px;">
      <table role="presentation" width="560" cellpadding="0" cellspacing="0"
             style="max-width:560px;width:100%;background:#141210;border:1px solid #3a2f1c;border-radius:12px;">
        <tr>
          <td style="padding:28px 32px 8px;">
            <div style="font-size:20px;letter-spacing:3px;font-weight:bold;color:#c9a45c;text-transform:uppercase;"
                 th:text="${shopName}">THE BARBER NEWS</div>
          </td>
        </tr>
        <tr>
          <td style="padding:16px 32px 0;font-size:15px;line-height:1.6;">
            <p style="margin:0 0 12px;" th:text="#{mail.greeting(${customerName})}">Hallo Max,</p>
            <p style="margin:0 0 20px;" th:text="#{${introKey}}">Dein Termin ist gebucht.</p>
          </td>
        </tr>
        <tr>
          <td style="padding:0 32px;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
                   style="border-top:1px solid #3a2f1c;border-bottom:1px solid #3a2f1c;font-size:14px;">
              <tr>
                <td style="padding:10px 0;color:#a39b8c;width:40%;" th:text="#{mail.label.service}">Leistung</td>
                <td style="padding:10px 0;" th:text="${serviceName}">Haarschnitt</td>
              </tr>
              <tr>
                <td style="padding:10px 0;color:#a39b8c;" th:text="#{mail.label.barber}">Barber</td>
                <td style="padding:10px 0;" th:text="${staffName}">Luca</td>
              </tr>
              <tr>
                <td style="padding:10px 0;color:#a39b8c;" th:text="#{mail.label.when}">Wann</td>
                <td style="padding:10px 0;font-weight:bold;"
                    th:style="${kind.startsWith('CANCELLED')} ? 'padding:10px 0;text-decoration:line-through;' : 'padding:10px 0;font-weight:bold;'"
                    th:text="${when}">Dienstag, 20. Oktober 2026 um 10:00 Uhr</td>
              </tr>
              <tr>
                <td style="padding:10px 0;color:#a39b8c;" th:text="#{mail.label.price}">Preis</td>
                <td style="padding:10px 0;" th:text="${price}">ab 35 €</td>
              </tr>
            </table>
          </td>
        </tr>
        <!-- cancel link (confirmations) -->
        <tr th:if="${cancelUrl != null and not kind.startsWith('CANCELLED')}">
          <td style="padding:24px 32px 0;font-size:14px;line-height:1.6;">
            <p style="margin:0 0 14px;color:#a39b8c;" th:text="#{mail.cancel.hint(${cancelHours})}">Du kannst nicht kommen?</p>
            <a th:href="${cancelUrl}" href="#"
               style="display:inline-block;padding:12px 22px;border:1px solid #c9a45c;border-radius:999px;color:#c9a45c;text-decoration:none;font-size:13px;letter-spacing:1px;text-transform:uppercase;"
               th:text="#{mail.cancel.button}">Termin stornieren</a>
          </td>
        </tr>
        <!-- rebook (cancellations) -->
        <tr th:if="${kind.startsWith('CANCELLED')}">
          <td style="padding:24px 32px 0;">
            <a th:href="${bookUrl}" href="#"
               style="display:inline-block;padding:12px 22px;background:#c9a45c;border-radius:999px;color:#120d05;text-decoration:none;font-size:13px;letter-spacing:1px;text-transform:uppercase;font-weight:bold;"
               th:text="#{mail.rebook}">Neuen Termin buchen</a>
          </td>
        </tr>
        <tr>
          <td style="padding:28px 32px 28px;font-size:14px;line-height:1.6;color:#a39b8c;white-space:pre-line;"
              th:text="#{mail.signature(${shopName})}">Bis bald, dein Team</td>
        </tr>
      </table>
      <p style="max-width:560px;margin:16px auto 0;font-size:11px;color:#6f675a;" th:text="#{mail.footer}">
        Diese E-Mail wurde automatisch versendet.</p>
    </td>
  </tr>
</table>
</body>
</html>
