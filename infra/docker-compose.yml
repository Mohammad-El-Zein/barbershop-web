# ─────────────────────────────────────────────────────────────────────────
# Local stack: PostgreSQL + backend API + Mailpit (catches all outgoing email).
#
#   cp infra/.env.example infra/.env   # then fill in the secrets
#   docker compose -f infra/docker-compose.yml up -d --build
#
#   API      http://localhost:${BACKEND_HOST_PORT:-8080}   (Swagger UI: /swagger-ui.html)
#   Mailpit  http://localhost:${MAILPIT_UI_PORT:-8025}
#   Postgres localhost:${POSTGRES_HOST_PORT:-5432}
#
# Production on one server: docker-compose.prod.example.yml (Caddy, HTTPS, frontend).
#
# Existing data volume from before the database roles? Create them once:
#   docker compose -f infra/docker-compose.yml exec postgres sh /docker-entrypoint-initdb.d/10-init-roles.sh
# ─────────────────────────────────────────────────────────────────────────
name: barbershop

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-barbershop}
      POSTGRES_USER: ${POSTGRES_USER:-barbershop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infra/.env}
      # roles created on the first start of the volume (postgres/10-init-roles.sh); the
      # superuser above is for setup only — the backend never connects with it
      DB_MIGRATION_USERNAME: ${DB_MIGRATION_USERNAME:-barbershop_migrator}
      DB_MIGRATION_PASSWORD: ${DB_MIGRATION_PASSWORD:?Set DB_MIGRATION_PASSWORD in infra/.env}
      DB_APP_USERNAME: ${DB_APP_USERNAME:-barbershop_app}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?Set DB_APP_PASSWORD in infra/.env}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/10-init-roles.sh:/docker-entrypoint-initdb.d/10-init-roles.sh:ro
      - ./postgres/init-roles.sql:/opt/barbershop/init-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.31
    restart: unless-stopped
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"   # web UI
      - "${MAILPIT_SMTP_PORT:-1025}:1025" # SMTP

  backend:
    build: ../backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-demo}
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-barbershop}
      # least-privilege application role (DML only); Flyway migrates on start with the owner role
      DB_USERNAME: ${DB_APP_USERNAME:-barbershop_app}
      DB_PASSWORD: ${DB_APP_PASSWORD}
      DB_MIGRATION_USERNAME: ${DB_MIGRATION_USERNAME:-barbershop_migrator}
      DB_MIGRATION_PASSWORD: ${DB_MIGRATION_PASSWORD}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-false}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      APP_MAIL_FROM: ${APP_MAIL_FROM:-The Barber News <no-reply@example.com>}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?Set APP_JWT_SECRET in infra/.env (at least 32 characters)}
      APP_TOKEN_SECRET: ${APP_TOKEN_SECRET:-}
      APP_COOKIE_SECURE: ${APP_COOKIE_SECURE:-false}
      APP_JOBS_ENABLED: ${APP_JOBS_ENABLED:-true}
      # per-IP rate limits (defaults are production values; raise locally for lots of manual testing)
      APP_RATE_LIMIT_BOOKINGS: ${APP_RATE_LIMIT_BOOKINGS:-10}
      APP_RATE_LIMIT_LOGIN: ${APP_RATE_LIMIT_LOGIN:-5}
      APP_RATE_LIMIT_AUTH_MAIL: ${APP_RATE_LIMIT_AUTH_MAIL:-5}
      APP_RATE_LIMIT_TOKEN_ACTIONS: ${APP_RATE_LIMIT_TOKEN_ACTIONS:-20}
      APP_RATE_LIMIT_REFRESH: ${APP_RATE_LIMIT_REFRESH:-30}
      # DEMO payments only — refused with the prod profile unless explicitly allowed
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-demo}
      PAYMENT_DEMO_ALLOW_IN_PROD: ${PAYMENT_DEMO_ALLOW_IN_PROD:-false}
      APP_ADMIN_EMAIL: ${APP_ADMIN_EMAIL:-}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      APP_FRONTEND_BASE_URL: ${APP_FRONTEND_BASE_URL:-http://localhost:3000}
      APP_CAPTCHA_PROVIDER: ${APP_CAPTCHA_PROVIDER:-none}
      APP_CAPTCHA_SECRET: ${APP_CAPTCHA_SECRET:-}
      APP_CAPTCHA_ALLOW_NONE_IN_PROD: ${APP_CAPTCHA_ALLOW_NONE_IN_PROD:-false}
      APP_RATE_LIMIT_STORE: ${APP_RATE_LIMIT_STORE:-memory}
      APP_RATE_LIMIT_REDIS_URL: ${APP_RATE_LIMIT_REDIS_URL:-}
      APP_MAIL_MAX_ATTEMPTS: ${APP_MAIL_MAX_ATTEMPTS:-8}
      APP_RETENTION_CANCELLED_MONTHS: ${APP_RETENTION_CANCELLED_MONTHS:-6}
      APP_RETENTION_COMPLETED_MONTHS: ${APP_RETENTION_COMPLETED_MONTHS:-0}
      APP_RETENTION_UNVERIFIED_DAYS: ${APP_RETENTION_UNVERIFIED_DAYS:-30}
      APP_RETENTION_OUTBOX_DAYS: ${APP_RETENTION_OUTBOX_DAYS:-30}
    ports:
      - "${BACKEND_HOST_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness | grep -q UP"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 10

volumes:
  pgdata:
