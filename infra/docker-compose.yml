# ─────────────────────────────────────────────────────────────────────────
# Local stack: PostgreSQL + backend API + Mailpit (catches all outgoing email).
#
#   cp infra/.env.example infra/.env   # then fill in the secrets
#   docker compose -f infra/docker-compose.yml up -d --build
#
#   API      http://localhost:${BACKEND_HOST_PORT:-8080}   (Swagger UI: /swagger-ui.html)
#   Mailpit  http://localhost:${MAILPIT_UI_PORT:-8025}
#   Postgres localhost:${POSTGRES_HOST_PORT:-5432}
#
# Production compose (reverse proxy, HTTPS, frontend) follows in phase 4.
# ─────────────────────────────────────────────────────────────────────────
name: barbershop

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-barbershop}
      POSTGRES_USER: ${POSTGRES_USER:-barbershop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infra/.env}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.31
    restart: unless-stopped
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"   # web UI
      - "${MAILPIT_SMTP_PORT:-1025}:1025" # SMTP

  backend:
    build: ../backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-demo}
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-barbershop}
      DB_USERNAME: ${POSTGRES_USER:-barbershop}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-false}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      APP_MAIL_FROM: ${APP_MAIL_FROM:-The Barber News <no-reply@example.com>}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?Set APP_JWT_SECRET in infra/.env (at least 32 characters)}
      APP_ADMIN_EMAIL: ${APP_ADMIN_EMAIL:-}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      APP_FRONTEND_BASE_URL: ${APP_FRONTEND_BASE_URL:-http://localhost:3000}
    ports:
      - "${BACKEND_HOST_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness | grep -q UP"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 10

volumes:
  pgdata:
