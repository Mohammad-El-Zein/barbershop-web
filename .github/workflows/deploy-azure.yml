# ─────────────────────────────────────────────────────────────────────────────
# Deploy one commit to one Azure environment (reusable; called by cd.yml and the manual
# deploy in ci.yml). Setup: docs/CD-SETUP.md.
#
# 1. backend: copies the image CI built and scanned (ghcr.io/…/backend:sha-<7>) into the ACR;
#    frontend: builds it with the NEXT_PUBLIC_* values of the GitHub environment (baked in at
#    build time, so one image per environment) and pushes it to the ACR. Tag: sha-<7>.
# 2. migrate job → backend → frontend → readiness check (infra/azure/scripts/rollout.sh);
#    a failed migration stops the deploy before anything is rolled out.
#
# No secrets: Azure login with OIDC (federated credential, no client secret); all values are
# variables of the GitHub environment (AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
# and `terraform output ci_variables`). Terraform ignores image changes on purpose.
# ─────────────────────────────────────────────────────────────────────────────
name: Deploy (reusable)

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub environment = Azure environment (dev / prod)
        type: string
        required: true
      sha:
        description: Full commit SHA; CI must have pushed ghcr images sha-<first 7>
        type: string
        required: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy · ${{ inputs.environment }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # required reviewers on the environment = manual approval (prod)
    environment:
      name: ${{ inputs.environment }}
      url: ${{ vars.NEXT_PUBLIC_SITE_URL }}
    # never two deploys of one environment at the same time; a running one is not cancelled
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read # pull the scanned backend image from ghcr.io
      id-token: write # OIDC login to Azure
    env:
      SHA: ${{ inputs.sha }}
      ACR: ${{ vars.ACR_NAME }}
    steps:
      - name: Check the environment variables
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          ACR_NAME: ${{ vars.ACR_NAME }}
          BACKEND_APP_NAME: ${{ vars.BACKEND_APP_NAME }}
          FRONTEND_APP_NAME: ${{ vars.FRONTEND_APP_NAME }}
          MIGRATE_JOB_NAME: ${{ vars.MIGRATE_JOB_NAME }}
          API_URL: ${{ vars.API_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_TENANT: ${{ vars.NEXT_PUBLIC_TENANT }}
        run: |
          missing=""
          for v in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_RESOURCE_GROUP ACR_NAME \
            BACKEND_APP_NAME FRONTEND_APP_NAME MIGRATE_JOB_NAME API_URL \
            NEXT_PUBLIC_SITE_URL NEXT_PUBLIC_API_URL NEXT_PUBLIC_TENANT; do
            [ -n "$(printenv "$v")" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::variables missing in the GitHub environment '${{ inputs.environment }}':$missing (docs/CD-SETUP.md)"
            exit 1
          fi
          case "$SHA" in
            *[!0-9a-f]* | "") echo "::error::not a commit SHA: $SHA"; exit 1 ;;
          esac
          echo "TAG=sha-${SHA::7}" >> "$GITHUB_ENV"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to the ACR (token from the OIDC session)
        run: az acr login --name "$ACR"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Backend image → ACR (the image CI scanned)
        run: |
          docker buildx imagetools create \
            --tag "$ACR.azurecr.io/barbershop-backend:$TAG" \
            "ghcr.io/${GITHUB_REPOSITORY,,}/backend:$TAG"
      - name: Frontend build arguments
        id: args
        env:
          SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          TENANT: ${{ vars.NEXT_PUBLIC_TENANT }}
          GA4_ID: ${{ vars.NEXT_PUBLIC_GA4_ID }}
          ADS_ID: ${{ vars.NEXT_PUBLIC_GOOGLE_ADS_ID }}
          ADS_LABEL: ${{ vars.NEXT_PUBLIC_GOOGLE_ADS_CONVERSION_LABEL }}
          META_ID: ${{ vars.NEXT_PUBLIC_META_PIXEL_ID }}
          TURNSTILE: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          # the site-wide DEMO strip only for a public demo site ("true")
          DEMO_BANNER: ${{ vars.NEXT_PUBLIC_SHOW_DEMO_BANNER || 'false' }}
        run: |
          {
            echo "list<<EOF"
            echo "VERSION=$TAG"
            echo "REVISION=$SHA"
            echo "NEXT_PUBLIC_SITE_URL=$SITE_URL"
            echo "NEXT_PUBLIC_API_URL=$API_URL"
            echo "NEXT_PUBLIC_TENANT=$TENANT"
            echo "NEXT_PUBLIC_GA4_ID=$GA4_ID"
            echo "NEXT_PUBLIC_GOOGLE_ADS_ID=$ADS_ID"
            echo "NEXT_PUBLIC_GOOGLE_ADS_CONVERSION_LABEL=$ADS_LABEL"
            echo "NEXT_PUBLIC_META_PIXEL_ID=$META_ID"
            echo "NEXT_PUBLIC_TURNSTILE_SITE_KEY=$TURNSTILE"
            echo "NEXT_PUBLIC_SHOW_DEMO_BANNER=$DEMO_BANNER"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Frontend image → ACR (built with this environment's values)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: frontend
          platforms: linux/amd64
          push: true
          tags: ${{ env.ACR }}.azurecr.io/barbershop-frontend:${{ env.TAG }}
          build-args: ${{ steps.args.outputs.list }}
          # layers (npm ci) from the CI build; the build arguments only change the last steps
          cache-from: type=gha,scope=frontend
          provenance: false
      - name: Migrate → backend → frontend → readiness
        env:
          RG: ${{ vars.AZURE_RESOURCE_GROUP }}
          MIGRATE_JOB: ${{ vars.MIGRATE_JOB_NAME }}
          BACKEND_APP: ${{ vars.BACKEND_APP_NAME }}
          FRONTEND_APP: ${{ vars.FRONTEND_APP_NAME }}
          API_URL: ${{ vars.API_URL }}
        run: |
          sh infra/azure/scripts/rollout.sh "$RG" "$MIGRATE_JOB" "$BACKEND_APP" "$FRONTEND_APP" \
            "$ACR.azurecr.io/barbershop-backend:$TAG" "$ACR.azurecr.io/barbershop-frontend:$TAG" "$API_URL"
      - name: Summary
        if: always()
        env:
          RESULT: ${{ job.status }}
          SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          API_URL: ${{ vars.API_URL }}
        run: |
          {
            echo "### Deploy ${{ inputs.environment }}: $RESULT"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Commit | \`$SHA\` |"
            echo "| Image tag | \`${TAG:-?}\` |"
            echo "| Website | $SITE_URL |"
            echo "| API readiness | $API_URL/actuator/health/readiness |"
          } >> "$GITHUB_STEP_SUMMARY"
